[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytest-testcontainers"
version = "0.3.2"
description = "Named pytest fixtures and a maker convention on top of testcontainers-python."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Michał Pasternak", email = "michal.dtz@gmail.com" },
]
keywords = [
    "pytest",
    "pytest-plugin",
    "testcontainers",
    "docker",
    "postgres",
    "redis",
    "mysql",
    "mongodb",
    "rabbitmq",
    "fixtures",
    "integration-testing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Testing :: Mocking",
]
dependencies = [
    "pytest >=7.4,<10",
    "testcontainers >=4.7,<5",
    "docker >=6.1",
    "tomli >=2 ; python_version < '3.11'",
]

[project.optional-dependencies]
clients-postgres = ["psycopg[binary] >=3.1"]
clients-mysql = ["pymysql >=1.1"]
clients-mongo = ["pymongo >=4.6"]
clients = [
    "psycopg[binary] >=3.1",
    "pymysql >=1.1",
    "pymongo >=4.6",
]
dev = [
    "pytest-xdist",
    "nox",
    "ruff",
    "pre-commit",
    "psycopg[binary] >=3.1",
    "pymysql >=1.1",
    "pymongo >=4.6",
    "redis",
    "pika",
]

[project.urls]
Funding = "https://buymeacoffee.com/mpasternak"
Homepage = "https://github.com/iplweb/pytest-testcontainers"
Repository = "https://github.com/iplweb/pytest-testcontainers"
Issues = "https://github.com/iplweb/pytest-testcontainers/issues"
Changelog = "https://github.com/iplweb/pytest-testcontainers/blob/main/CHANGELOG.md"

[project.entry-points.pytest11]
testcontainers = "pytest_testcontainers.plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_testcontainers"]

[tool.hatch.build.targets.sdist]
include = [
    "src/pytest_testcontainers",
    "tests",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
minversion = "7.4"
testpaths = ["tests"]
markers = [
    "docker_required: test requires a running Docker daemon",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:docker.*",
    "ignore::DeprecationWarning:testcontainers.*",
    # testcontainers >=4.15 moved the service modules under
    # `testcontainers.community.*` and deprecated the old paths. It warns with
    # stacklevel=2, so Python attributes the warning to *our* importing module,
    # not to `testcontainers.*` — the module-keyed ignore above cannot match it.
    # We keep importing the old paths because they are the only ones that exist
    # across the whole supported range (testcontainers >=4.7,<5); revisit when
    # the floor rises above 4.15.
    "ignore:testcontainers\\..* is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
